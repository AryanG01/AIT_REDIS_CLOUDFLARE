name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - feature/redis-cloudflare-integration
  workflow_dispatch:

jobs:
  deploy-workers:
    name: Deploy Workers API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: gemini-os-starter/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: gemini-os-starter
        run: pnpm install --frozen-lockfile

      - name: Deploy Workers
        working-directory: gemini-os-starter
        run: pnpm run deploy:workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-workers
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: gemini-os-starter/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: gemini-os-starter
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: gemini-os-starter
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        working-directory: gemini-os-starter
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
