name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - feature/redis-cloudflare-integration
      - feature/security-proxy-migration
  workflow_dispatch:

jobs:
  deploy-workers:
    name: Deploy Workers API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: gemini-os-starter/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: gemini-os-starter
        run: pnpm install --frozen-lockfile

      - name: Deploy Workers
        working-directory: gemini-os-starter
        run: pnpm run deploy:workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy Cloudflare Pages
    runs-on: ubuntu-latest
    needs: deploy-workers
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: gemini-os-starter/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: gemini-os-starter
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: gemini-os-starter
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: gemini-os-starter
        run: |
          DEPLOY_OUTPUT=$(pnpm run deploy 2>&1)
          echo "$DEPLOY_OUTPUT"
          # Extract URL from deployment output
          PAGES_URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[a-z0-9]*\.storyforged\.pages\.dev' | head -1)
          echo "pages_url=$PAGES_URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with Deployment URLs
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const pagesUrl = '${{ steps.deploy.outputs.pages_url }}';
            const workersUrl = 'https://storyforged-api.rajeevganju0.workers.dev';
            const branch = context.ref.replace('refs/heads/', '');

            // Find PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`
            });

            if (prs.length === 0) {
              console.log('No open PR found for this branch');
              return;
            }

            const pr = prs[0];
            const commentBody = `## 🚀 Deployment Successful!

            Your StoryForged app has been deployed:

            - **Frontend (Pages):** ${pagesUrl || 'Deploying...'}
            - **Backend (Workers API):** ${workersUrl}

            ---
            *Deployed from commit: ${context.sha.substring(0, 7)}*`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🚀 Deployment Successful')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody
              });
            }
