name = "storyforged-api"
main = "workers/index.ts"
compatibility_date = "2024-01-01"

# This is the Workers API backend
# Frontend will be deployed separately to Cloudflare Pages

# Environment Variables (set via wrangler secret put)
# FAL_KEY - Secret
# UPSTASH_REDIS_REST_TOKEN - Secret
# GEMINI_API_KEY - Secret
# UPSTASH_REDIS_REST_URL - Non-secret (set via wrangler secret put or dashboard)

# KV Namespaces for distributed caching
[[kv_namespaces]]
binding = "SPRITE_CACHE"
id = "fa535d63200248e59dffd48b276e1761"
preview_id = "4cc8777a93674bc385c0322a7f3d5c50"

[[kv_namespaces]]
binding = "ROOM_CACHE"
id = "1a2c613af04e4799966f8249a25d24a0"
preview_id = "909375d3dbd34fbe8f50066e9d57ce04"

[[kv_namespaces]]
binding = "AUDIO_CACHE"
id = "cee50ff7695e41b5a504e4a43951fecf"
preview_id = "be8b12018c2f4d21b3e0dd8f81c65d24"

# Worker settings
[vars]
ENVIRONMENT = "production"

# Note: CPU limits are only available on paid plans
